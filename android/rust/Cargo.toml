# PxLScan native core: the JNI cdylib behind `com.pixelicious.pxlscan.Native`.
# The interface is docs/CORE-CONTRACT.md; do not change a JSON key without changing it there.
#
# Standalone workspace on purpose: it builds alone with cargo-ndk.
# Build (from this directory):
#   cargo ndk -t arm64-v8a -P 26 -o ../app/src/main/jniLibs build --release
[package]
name = "pxlscan_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "pxlscan_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "unwind"

[workspace]
